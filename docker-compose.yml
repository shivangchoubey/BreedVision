version: '3.8'

services:
  breedvision-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: breedvision:latest
    container_name: breedvision_app
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DatabaseProvider=Sqlite
    volumes:
      - breedvision_data:/app/Data
      - breedvision_uploads:/app/wwwroot/uploads
    restart: unless-stopped

volumes:
  breedvision_data:
  breedvision_uploads:

